[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finharness"
version = "0.1.0"
description = "Financial research copilot scaffold"
requires-python = ">=3.13"
dependencies = [
    "akshare>=1.16",
    "cryptography>=50.0.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.14",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
# 可观测性后端（docs 03.14）：核心依赖不含它们，未安装时 metrics/tracing
# 自动降级为 no-op，只有日志（纯标准库）始终可用。
observability = [
    "prometheus-client>=0.21",
    "langsmith>=0.1.100",
]
# 向量库（docs 03.6.4 语义记忆）：未安装或服务不可用时，检索按
# "SQLite BLOB 暴力余弦 → 键匹配" 逐级降级，记忆链路不受影响。
vector = [
    "qdrant-client>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Runtime content assets: the system prompt and the scenario skills (a SKILL.md
# plus its references/*.md and assets/*.md) are read from disk at run time, so
# all of them must ship with the package.
finharness = [
    "prompts/*.md",
    "skills/*/SKILL.md",
    "skills/*/references/*.md",
    "skills/*/assets/*.md",
]

[tool.pytest.ini_options]
# The repo root is on the path as well as src/: a few test modules import sibling
# helpers by their package path (``from tests.data.pdf_fixtures import ...``), and
# ``tests/`` is a namespace package without an ``__init__.py``, so those imports
# only resolve when the root itself is importable.
pythonpath = ["src", "."]
testpaths = ["tests"]
# Smoke tests hit real providers and data sources; they run only on demand
# (``uv run pytest -m smoke``).
addopts = "-m 'not smoke'"
markers = [
    "smoke: hits real providers/data sources; needs network and credentials",
]
