[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finharness"
version = "0.1.0"
description = "Financial research copilot scaffold"
requires-python = ">=3.13"
dependencies = [
    "akshare>=1.16",
    "cryptography>=50.0.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Runtime content assets: the system prompt and the skill catalogue are read
# from disk at run time, so they must ship with the package.
finharness = ["prompts/*.md", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Smoke tests hit real providers and data sources; they run only on demand
# (``uv run pytest -m smoke``).
addopts = "-m 'not smoke'"
markers = [
    "smoke: hits real providers/data sources; needs network and credentials",
]
