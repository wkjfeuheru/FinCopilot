# FinHarness 生产部署编排：应用 + Qdrant 向量库 + Caddy 自动 TLS。
# 用法见 docs/deploy/aliyun.md。密钥只写同目录 .env（git 忽略），不入库不入镜像。
#
# 首次启动前：cp deploy/.env.example deploy/.env 并填入域名与密钥。

services:
  app:
    image: finharness:local
    build:
      context: ..
      dockerfile: Dockerfile
      # 网络受限环境换镜像源；境外服务器构建删除此行即可
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}
    restart: unless-stopped
    # 容器内 entrypoint 已做 root 接管 /data 后降权，无需 user 覆盖
    volumes:
      - app-data:/data
    environment:
      FINH_COMPUTE_REMOTE_WORKER_URL: http://worker:8080
      # 由 .env 提供的内部 HMAC；必须与 worker 相同，且不可复用业务密钥。
      FINH_COMPUTE_HMAC_SECRET: ${FINH_COMPUTE_HMAC_SECRET}
      # Provider 密钥经 .env 注入；未配置的项为空字符串，等同未设置
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      HITHINK_FINANCE_API_KEY: ${HITHINK_FINANCE_API_KEY:-}
      # 是否开放注册：初始化管理员账号后改回 false 并 docker compose up -d
      FINH_AUTH_ALLOW_REGISTER: ${FINH_AUTH_ALLOW_REGISTER:-false}
      # /metrics 抓取令牌：仅在启用 metrics 时需要（远程模式强制）。
      FINH_SERVER_METRICS_TOKEN: ${FINH_SERVER_METRICS_TOKEN:-}
      # 语义记忆向量库（docs 03.6.4）：指向下方 qdrant 服务；向量只存 Qdrant，
      # SQLite 只留记录本体。服务未起时应用照常运行，仅少一层语义召回。
      FINH_LTM_VECTOR_DB_URL: ${FINH_LTM_VECTOR_DB_URL:-http://qdrant:6333}
    # 只绑定本机回环：公网流量一律走 Caddy，应用不直接暴露
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - compute
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/v1/ready', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    # 只在内网暴露：仅 app 访问，不经 Caddy 上公网
    expose:
      - "6333"
    volumes:
      - qdrant-data:/qdrant/storage

  worker:
    image: finharness:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # worker 无 Volume、无 Provider/搜索密钥，也没有外网所在的 edge 网络。
    user: "10001:10001"
    entrypoint: ["python", "-m", "finharness.compute.worker"]
    environment:
      FINH_COMPUTE_APP_URL: http://app:8000
      FINH_COMPUTE_HMAC_SECRET: ${FINH_COMPUTE_HMAC_SECRET}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - compute

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-fin.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

volumes:
  app-data:
  caddy-data:
  caddy-config:
  qdrant-data:

networks:
  edge:
  compute:
    internal: true
