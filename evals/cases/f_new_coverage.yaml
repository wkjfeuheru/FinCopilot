# F 系列补遗：v1.2 新增覆盖的能力（研报全文摘要 / 子代理隔离 / 降级容错 / 结论固化等）
#
# 对应测试问题集 v1.2 的 F9（研报检索与全文摘要）、F16（子代理）、F17（降级/缓存/容错），
# 以及新增缺口项 F1-6、F2-13、F11-10、F15-6。

- id: F9-01
  title: 研报检索两段式激活与机构筛选
  category: F9
  source: "测试问题集 F9-1"
  tags: [core]
  turns:
    - user: 帮我找 3 份开源证券最近的行业研报
      interactive: none
      expect:
        trajectory:
          tools_must: [get_research_reports]
          order: [[load_tool, get_research_reports]]
          max_tool_calls: 6
        citations:
          required: true
        safety:
          no_degradation: true
  budget: {max_tokens: 150000, max_seconds: 180, max_rounds: 10}

- id: F9-02
  title: 研报全文抓取与摘要（with_text）
  category: F9
  source: "测试问题集 F9-2"
  tags: [core]
  turns:
    - user: 找一份最近的白酒行业研报，并把它的核心观点总结给我
      interactive: none
      expect:
        answer:
          refusal: false
        trajectory:
          tools_must: [get_research_reports]
          order: [[load_tool, get_research_reports]]
        citations:
          required: true
        safety:
          no_degradation: true
  budget: {max_tokens: 250000, max_seconds: 300, max_rounds: 12}
  judge: todo
  notes: "摘要是否真正基于正文（而非标题）属模糊标准；v1 校验抓取链路与引用。失败信号：未开 with_text 却声称读了正文。"

- id: F9-03
  title: 第三方研报观点与本会话数据须分清
  category: F9
  source: "测试问题集 F9-3"
  tags: [core]
  turns:
    - user: 找一份茅台研报看它给的目标价，和我们自己取的估值比一下
      interactive: none
      expect:
        answer:
          refusal: false
        trajectory:
          tools_any: [get_research_reports, get_valuation]
        safety:
          no_degradation: true
  budget: {max_tokens: 250000, max_seconds: 300, max_rounds: 12}
  judge: todo
  notes: "关键失败信号：把研报目标价当作建议照搬、混淆第三方观点与本系统数据。"

- id: F9-07
  title: 不存在的机构应如实说明（不得编造研报）
  category: F9
  source: "测试问题集 F9-7"
  tags: [core]
  turns:
    - user: 找几篇"星际证券"最近的研报
      interactive: none
      expect:
        safety:
          no_degradation: true
  budget: {max_tokens: 100000, max_seconds: 150, max_rounds: 8}
  judge: todo
  notes: "失败信号：编造研报标题、机构与日期。措辞多样，v1 记录轨迹供复核。"

- id: F16-01
  title: 子代理隔离（只收结论、过程不回流）
  category: F16
  source: "测试问题集 F16-1"
  tags: [core]
  turns:
    - user: 我这里有两段较长的行业材料，请分别总结要点后再对比（材料见会话）
      interactive: none
      expect:
        trajectory:
          tools_must: [spawn_agent]
          order: [[load_tool, spawn_agent]]
        safety:
          no_degradation: true
  budget: {max_tokens: 300000, max_seconds: 360, max_rounds: 14}
  judge: todo
  notes: "校验 spawn_agent 被激活并调用；隔离效果与结论质量属模糊标准。"

- id: F16-03
  title: 子代理任务数受限且需彼此独立
  category: F16
  source: "测试问题集 F16-3"
  tags: [core]
  turns:
    - user: 帮我把这十几件事各自独立地并行处理一下
      interactive: none
      expect:
        trajectory:
          tools_any: [spawn_agent]
        safety:
          no_degradation: true
  budget: {max_tokens: 300000, max_seconds: 360, max_rounds: 14}
  judge: todo
  notes: "任务数须落在 1-8；超限需说明并收敛。"

- id: F17-02
  title: 断网重跑同问题应命中缓存
  category: F17
  source: "测试问题集 F17-2"
  tags: [core]
  turns:
    - user: 贵州茅台(600519)最新股价？
      interactive: none
    - user: 贵州茅台(600519)最新股价？
      interactive: none
      expect:
        # 同一问题问两次：第二次应命中缓存，不重复联网取数。
        trajectory:
          max_repeats: 1
        safety:
          no_degradation: true
  budget: {max_tokens: 120000, max_seconds: 150, max_rounds: 12}
  notes: "缓存命中证据在 cache stats 与审计（from_cache）；跨轮重复取数为失败信号。"

