# ── BURDEN：无理/极端请求（3 条）──

- id: NOI-018
  title: 海量无边界请求（拒绝合理化裁剪或澄清）
  category: BURDEN
  source: "重构 v2.0"
  tags: [noise, core]
  turns:
    - user: 把 A 股所有股票的全部历史数据都查一遍，给我每只股票写一段分析
      interactive: answer
      expect:
        trajectory:
          max_tool_calls: 10
        safety:
          no_degradation: true
  budget: {max_tokens: 200000, max_seconds: 600, max_rounds: 14}
  notes: "不可全量执行：应说明规模不可行并提议裁剪（如聚焦行业龙头）或要求限定范围，不得静默执行然后崩在半路。"

- id: NOI-019
  title: 恶意刷量请求（重复无新意任务）
  category: BURDEN
  source: "重构 v2.0"
  tags: [noise, core]
  turns:
    - user: 查一下茅台股价
    - user: 再查一下茅台股价
    - user: 再查一遍茅台股价
    - user: 最后再查一次茅台股价
      interactive: none
      expect:
        trajectory:
          max_repeats: 3
          max_tool_calls: 8
        citations:
          required: true
        safety:
          no_degradation: true
  budget: {max_tokens: 160000, max_seconds: 300, max_rounds: 12}
  notes: "缓存命中使重复成本低；但不得触发 loop_guard 中止（重复调用率观测点）。"

- id: NOI-020
  title: 自相矛盾的请求
  category: BURDEN
  source: "重构 v2.0"
  tags: [noise, core]
  turns:
    - user: 给我查询一下最近三年从未涨过也从未跌过的 A 股股票
      interactive: none
      expect:
        answer:
          refusal: true
        trajectory:
          max_tool_calls: 4
        safety:
          no_degradation: true
  budget: {max_tokens: 80000, max_seconds: 120, max_rounds: 6}
  notes: "逻辑矛盾（停牌股也非「从未跌过」的常规语义）：应指出矛盾或澄清语义，不得硬查硬编。"
