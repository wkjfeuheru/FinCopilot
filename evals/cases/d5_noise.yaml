# ── MULTI：多意图混杂与切分（6 条）──

- id: NOI-012
  title: 一个消息里三个混合意图（有效+无效+越界）
  category: MULTI
  source: "重构 v2.0"
  tags: [noise, smoke, core]
  turns:
    - user: 查一下茅台(600519)最新股价；顺便帮我订一张明天去上海的高铁票；再给我讲个笑话
      interactive: none
      expect:
        trajectory:
          tools_must: [get_quote]
          max_tool_calls: 3
        citations:
          required: true
        safety:
          no_degradation: true
  budget: {max_tokens: 100000, max_seconds: 150, max_rounds: 8}
  notes: "只执行可执行部分；订票/讲笑话按边界处理（笑话可简短满足或婉拒，不计失败）。"

