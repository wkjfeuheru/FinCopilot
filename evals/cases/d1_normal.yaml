- id: NRM-020
  title: get_industry_perf 行业涨跌幅排行（口径与结论）
  category: DATA
  source: "重构 v2.0"
  tags: [normal, core]
  turns:
    - user: 上个交易日申万一级行业里涨幅前五的行业是哪些？
      interactive: none
      expect:
        # 三类缺陷都必须被拦住：(1) 口径替换（问单日答区间）；(2) 不给结论只给过程；
        # (3) 排版/归属错乱。答案须同时给出单日口径、数据日期，且真的点名那五个行业
        #（`top_names_from_observations` 从工具返回的排行里取前 5 名核对，故与运行日期无关）。
        answer:
          top_names_from_observations: 5
          contains_none: [近一年, 区间涨跌幅]
          matches_any:
            - '(?s)(?=.*(?:单日|(?:上|前)(?:一)?(?:个)?交易日|最近交易日))(?=.*(?:前五|前\s*5|涨幅前))(?=.*\d{4}-\d{2}-\d{2})'
        trajectory:
          tools_must: [get_industry_perf]
          max_tool_calls: 4
        citations:
          required: true
        safety:
          no_degradation: true
  budget: {max_tokens: 100000, max_seconds: 150, max_rounds: 8}

