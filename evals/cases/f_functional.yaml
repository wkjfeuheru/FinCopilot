# F 系列：功能完善性测试（投研任务 × 工具/技能链路）
#
# 从 docs/测试问题集-功能与幻觉.md 的「预期链路 / 通过标准 / 典型失败信号」翻译而来。
# 判定看行为模式而非字面文本。source 字段回链人工题库题号。

- id: F1-01
  title: 单点查询不应过度规划
  category: F1
  source: "测试问题集 F1-1"
  tags: [smoke, core]
  turns:
    - user: 贵州茅台(600519)今天的最新股价是多少？
      interactive: none
      expect:
        answer:
          refusal: false
        trajectory:
          tools_must: [get_quote]
          plan_required: false
          max_tool_calls: 3
        citations:
          required: true
        safety:
          no_degradation: true
  budget: {max_tokens: 60000, max_seconds: 90, max_rounds: 6}
  notes: "一次性单点取数≠复杂问题，不应调用 research_plan。"

- id: F1-02
  title: 两点并行取数仍不规划
  category: F1
  source: "测试问题集 F1-2"
  tags: [core]
  turns:
    - user: 五粮液(000858)最新股价和当前市盈率分别是多少？
      interactive: none
      expect:
        trajectory:
          tools_any: [get_quote, get_valuation]
          plan_required: false
          max_tool_calls: 5
        safety:
          no_degradation: true
  budget: {max_tokens: 80000, max_seconds: 120, max_rounds: 8}

- id: F1-03
  title: 多标的对比应先立计划再分阶段执行
  category: F1
  source: "测试问题集 F1-3"
  tags: [core]
  turns:
    - user: 对比贵州茅台(600519)与五粮液(000858)近三年盈利能力变化，并归因差异原因
      interactive: none
      expect:
        answer:
          refusal: false
        trajectory:
          plan_required: true
          tools_any: [get_indicators, calc_metrics]
          max_tool_calls: 12
        citations:
          required: true
        safety:
          no_degradation: true
  budget: {max_tokens: 200000, max_seconds: 240, max_rounds: 14}
  judge: todo
  notes: "归因是否合理属模糊标准，v1 仅校验规划+取数+引用结构。"

