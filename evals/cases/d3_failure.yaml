# D3 工具失败类（failure，30 条）
#
# 判定核心：自然故障触发下优雅降级——说明失败原因、换正确路径或数据源、
# 交付部分结论并明示局限，不崩溃、不编造、不无限重试。
# ID 前缀 FAI。category 第一段 = 故障面（SYMBOL/PATH/ADAPTER/BADINPUT/
# PARTIAL/RESOURCE）。
# 全部采用自然故障（非法参数、不存在资源、超界路径、能力缺失），不依赖
# 代码级故障注入，任何部署形态都可确定性触发。

