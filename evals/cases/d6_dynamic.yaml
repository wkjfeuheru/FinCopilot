# D6 动态编排类（dynamic，14 条）
#
# 主题：**引擎的两类动态行为**——按问题意图自动注入场景技能（skill），以及按任务结构
# 把工作分派给子代理（spawn_agent）。二者都不是模型可自行调用的"工具"，而是引擎在
# 路由/编排层的动作，因此断言落在**可观测的注入与分派**上，而不是回答措辞。
#
# 判定核心：
#   * 技能注入（skills_must / skills_must_not）读 ``context_routed`` 事件。
#     键的词汇是精确的：**裸技能名**（``equity-research``）代表注入了该场景的
#     **流程** SKILL.md；``技能/文件``（``equity-research/references/valuation.md``）
#     代表只注入了某份**方法论/模板**。单一能力的问题只该拿到方法论、不该连带整套
#     流程，因此 "裸名缺席" 本身是可断言的契约（见 DYN-005/DYN-008）。
#   * 子代理分派读工具轨迹。触发判据是"每个工作单元的中间材料量"，不是"是不是取数"：
#     逐实体深分析 → 可扇出；单纯并行取几份数据 → 不扇出（同轮 gather 即可）。
#     因此多数多实体用例用 ``tools_any``（扇出自由裁量）。**若**扇出，则由
#     ``spawn_tasks_cover`` 强制"逐单元拆解"（每个实体须出现在某条子任务里），
#     ``answer.contains_all`` 无条件守住"每个实体都被最终答案覆盖"。spawn_agent 是
#     懒加载工具，直接调用即激活（docs 03.4.3）。
#
# ID 前缀 DYN。category 第一段 = 功能域（SKILL/META）。
# 执行：python -m finharness.eval run --set dynamic

# ── 技能动态加载：多能力叠加注入多套流程 + 方法论 ──
# 门槛：命中 ≥2 个研究能力时，连场景**流程**一起注入（_SKILL_FLOW_THRESHOLD=2）。

