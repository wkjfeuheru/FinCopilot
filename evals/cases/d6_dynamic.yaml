# ── 子代理分派：把相互独立的工作线交给并行子代理 ──

- id: DYN-009
  title: 四家银行资产质量各自独立评估（扇出）
  category: META
  source: "动态编排 v1"
  tags: [normal, dynamic, core]
  turns:
    - user: 分别评估招商银行(600036)、兴业银行(601166)、平安银行(000001)、宁波银行(002142)的资产质量，各给一句话结论
      interactive: none
      expect:
        answer:
          contains_all: [招商银行, 兴业银行, 平安银行, 宁波银行]
        trajectory:
          tools_any: [spawn_agent, get_indicators, get_financials]
          spawn_tasks_cover: ["600036", "601166", "000001", "002142"]
          max_tool_calls: 80
        citations:
          required: true
        safety:
          no_degradation: true
  budget: {max_tokens: 650000, max_seconds: 900, max_rounds: 24}
  notes: "扇出为自由裁量（docs 03.10：隔离是唯一理由，prompt 明确「不要为并行取数派
        子代理」）：并行取几家银行的数据本就该在同一轮内并行取数，故 spawn_agent 降为
        tools_any——串行取数作答同样合格。
        另有一个与扇出无关的真实数据覆盖缺口：银行资产质量指标（不良率/拨备覆盖率/
        关注类/逾期/资本充足）在本仓库**无任何可取来源**——get_indicators 返回 25 列均
        不含这些字段、get_financials 只有利润/资产/现金流三表且无银行比率推导、
        list_fuyao_datasets 因 egress=True 在 interactive:none 下被确认通道拒绝。因此
        **如实回答「没有可用数据源」即为正确行为**（不得编造数字）。citations.required
        兼作「确实作答了」的守卫。"

