# ── 为什么这里没有「正向扇出」验收位（2026-09-25 实测结论）──
# 曾试加 DYN-015：四段材料内联在用户消息里，要求逐段精读并对比分歧，意图制造「中间材料
# 挤占主上下文」的扇出场景。实测（deepseek-chat）该用例**0 次工具调用**，模型直接作答，
# 理由正确：「四位分析师的观点都在你给出的材料里，不需要取数」。
# 两处设计教训，记录以免重蹈：
#   1. 材料一旦内联进用户消息，它就已经在主上下文里了——把它交给子代理换不来任何隔离。
#      隔离价值只在材料**不在**主上下文时成立（落盘的长文档、需大量工具轮次才能消化的
#      过程）。故「内联材料 + 期望扇出」是自相矛盾的组合。
#   2. `tools_any: [X]` 只有一个候选时**等价于 tools_must**（scorer：`any(name in executed
#      for name in any_of)`），不是「软位」。当前断言词汇里无法表达「希望但接受不扇出」。
# 结论：在「非交互 eval（写/egress 被拒）+ deepseek-chat 基线」下，没有既真有隔离压力、
# 又能诚实通过的扇出验收位。真该扇出的形态（多份落盘长文档）需要写权限与前置产物，超出
# 本套件范围。因此不保留永不触发的占位用例；扇出的**机制**健康性由
# tests/coordinator/test_spawn_integration.py（真实 loop 扇出 + 隔离断言）与 write_report
# 的风险复核实跑（output/*.review.md + done.per_agent['risk']）保证。

