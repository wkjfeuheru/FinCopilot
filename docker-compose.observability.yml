# FinHarness 可观测性栈：Prometheus + Grafana（docs 03.14.2）。
#
# 用法：
#   1. 以 observability.metrics.enabled=true 启动应用（默认 8000 端口）
#   2. docker compose -f docker-compose.observability.yml up -d
#   3. 打开 Grafana http://localhost:3000 （admin/admin），面板已自动装载
#
# 这是开发/单机运维用的最小栈；生产环境应把 Prometheus 换成已有实例，
# 只需保留 ops/prometheus/prometheus.yml 里的抓取任务。

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: finharness-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    extra_hosts:
      # Linux 上 host.docker.internal 默认不存在，显式指向宿主机网关，
      # 使容器内的 Prometheus 能抓到跑在宿主机的应用。
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: finharness-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
